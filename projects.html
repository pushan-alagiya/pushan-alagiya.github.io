<body class="d-flex flex-column h-100 bg-light">
  <div id="loadOverlay" style="
        background-color: rgb(54, 54, 54);
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        z-index: 2000;
      ">
    <div style="
          display: flex;
          width: 100%;
          height: 100%;
          margin: auto;
          align-items: center;
          color: white;
          justify-content: center;
          font-size: 24px;
          font-weight: bold; /* Optionally make it bold */
          animation: pulse 1s infinite alternate; /* Add animation */
        ">
      <div class="loading-spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
  <main class="flex-shrink-0">
    <!-- Navigation (injected from js/data.js + components.js)-->
    <div id="nav-placeholder"></div>
    <!-- Projects Section-->
    <section class="py-5">
      <div class="container px-5 mb-5">
        <!-- Project Header -->
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bolder mb-0">
            <span class="text-gradient d-inline">Projects</span>
          </h1>
        </div>

        <!-- Main Div -->
        <div class="row gx-5 justify-content-center">
          <div class="col-lg-11 col-xl-9 col-xxl-8" id="projectsContainer">
            <!-- Projects will be dynamically rendered here -->
          </div>
        </div>
      </div>
    </section>
    <!-- Call to action section-->
    <section class="py-5 bg-gradient-primary-to-secondary text-white">
      <div class="container px-5 my-5">
        <div class="text-center">
          <h2 class="display-4 fw-bolder mb-4">
            Let's build something together
          </h2>
          <a class="btn btn-outline-light btn-lg px-5 py-3 fs-6 fw-bolder" href="contact.html">Contact me</a>
        </div>
      </div>
    </section>
  </main>
  <!-- Footer (injected from js/components.js)-->
  <div id="footer-placeholder"></div>
