      if (!container) return;

      container.innerHTML = projectsData

          <div class="card overflow-hidden shadow rounded-4 border-0 mb-5">
            <div class="card-body p-0">
              <div class="d-flex align-items-center row align-items-center gx-5">
                <div class="col text-center text-mg-start mb-4 mb-lg-0">
                  <a href="${project.githubUrl}" target="_blank">
                    <img
                      src="${project.image}"
                      alt="${project.title}"
                      width="100%"
                      class="${project.imageClass}"
                    />
                  </a>
                </div>
                <div class="projects-5">
                  <h2 class="fw-bolder text-gradient text-center">
                    ${project.title}
                  </h2>
                  <br />
                  <p class="text-sm">
                    ${project.description}
                  </p>
                </div>
              </div>
            </div>

        .join("");
