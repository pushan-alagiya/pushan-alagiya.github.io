<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

      name="google-site-verification"
      content="fssZF9jqXUfTCFFUgXvzD3GDM-6fsUcs8nzeJsVhnwI"
    />
    <meta
      name="keywords"
      content="Pushan, Alagiya, Portfoio, NodeJS Portfolio, NodeJS Developer, Blockchain "
    />
    <meta name="description" content="Pushan Alagiya Portfolio" />
    <meta property="og:title" content="Certificates | Pushan Alagiya" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pushan-alagiya.github.io/certificates" />
    <title>Certificates</title>

    <link rel="stylesheet" href="css/loader.css" />


    <!-- icon-->
    <link rel="icon" type="image/x-icon" href="assets/profile.png" />

    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap icons-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link class="corecss" href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/css/bootstrap.min.css">

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Data and components (load before scripts)-->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
  </head>

  <body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
      <div id="loadOverlay" style="
        background-color: #090A0F;
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        z-index: 2000;
      ">
        <div style="
          display: flex;
          width: 100%;
          height: 100%;
          margin: auto;
          align-items: center;
          color: white;
          justify-content: center;
          font-size: 24px;
          font-weight: bold;
          animation: pulse 1s infinite alternate;
        ">
          <div class="loading-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
      <!-- Global Ambient Background -->
      <div class="position-fixed top-0 start-0 w-100 h-100" style="z-index: -1; pointer-events: none; overflow: hidden;">
        <div class="ambient-blob blob-primary" style="width: 600px; height: 600px; top: -10%; left: -10%; animation-delay: 0s;"></div>
        <div class="ambient-blob blob-info" style="width: 500px; height: 500px; top: 40%; right: -10%; animation-delay: -5s;"></div>
        <div class="ambient-blob blob-secondary" style="width: 700px; height: 700px; bottom: -20%; left: 20%; animation-delay: -10s;"></div>
      </div>
      <!-- Navigation (injected from js/data.js + components.js)-->
      <div id="nav-placeholder"></div>

      <!-- Page Content-->
      <div class="container px-5 my-5">
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bolder mb-0">
            <span class="text-gradient d-inline">Achievements</span>
          </h1>
        </div>
        <div class="row gx-5 justify-content-center">
          <div class="col-lg-11 col-xl-9 col-xxl-8">
            <!-- Awards Section (injected from js/data.js)-->
            <section>
              <div class="d-flex align-items-center mb-4">
                <div class="section-accent-bar"></div>
                <h2 class="text-primary fw-bolder mb-0">Awards & Honors</h2>
              </div>
              <div id="awardsContainer" class="row gx-4">
                <!-- Awards injected from js/data.js -->
              </div>
            </section>

            <div class="pb-5"></div>

            <!-- Certifications Section (injected from js/data.js)-->
            <section>
              <div class="d-flex align-items-center mb-4">
                <div class="section-accent-bar"></div>
                <h2 class="text-primary fw-bolder mb-0">Professional Certifications</h2>
              </div>
              <div id="certificationsContainer">
                <!-- Certifications injected from js/data.js -->
              </div>
            </section>
          </div>
        </div>
        </main>


    <!-- Footer (injected from js/components.js)-->
    <div id="footer-placeholder"></div>
    
  </body>
</html>
