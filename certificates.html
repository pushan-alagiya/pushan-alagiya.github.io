    <!-- Bootstrap core JS-->

  <body class="d-flex flex-column h-100 bg-light">
    <main class="flex-shrink-0">
      <div
        id="loadOverlay"
      style="
        background-color: rgb(54, 54, 54);
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        z-index: 2000;
      "
    >
      <div
        style="
          display: flex;
          width: 100%;
          height: 100%;
          margin: auto;
          align-items: center;
          color: white;
          justify-content: center;
          font-size: 24px;
          font-weight: bold; /* Optionally make it bold */
          animation: pulse 1s infinite alternate; /* Add animation */
        "
      >
        <div class="loading-spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
      <!-- Navigation (injected from js/data.js + components.js)-->

        <div class="text-center mb-5">

            <section>

                  <div id="awardsContainer" class="row align-items-center gx-5">
                    <!-- Awards injected from js/data.js -->
                  </div>
                </div>
              </div>
            </section>

            <div class="pb-5"></div>

            <!-- Certifications Section (injected from js/data.js)-->
            <section>
              <h2 class="text-primary fw-bolder mb-4">Certifications</h2>
              <div id="certificationsContainer">
                <!-- Certifications injected from js/data.js -->
              </div>
            </section>
          </div>
        </div>
        </main>


    <!-- Footer (injected from js/components.js)-->
