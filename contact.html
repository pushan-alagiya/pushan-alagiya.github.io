<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="google-site-verification"
      content="fssZF9jqXUfTCFFUgXvzD3GDM-6fsUcs8nzeJsVhnwI"
    />
    <meta
      name="keywords"
      content="Pushan, Alagiya, Portfoio, NodeJS Portfolio, NodeJS Developer, Blockchain "
    />
    <meta name="description" content="Pushan Alagiya Portfolio" />
    <meta property="og:title" content="Contact | Pushan Alagiya" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://pushan-alagiya.github.io/contact"
    />
    <title>My portfolio</title>

    <link rel="stylesheet" href="css/loader.css" />

    <!-- icon-->
    <link rel="icon" type="image/x-icon" href="assets/profile.png" />

    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap icons-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link class="corecss" href="css/styles.css" rel="stylesheet" />

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Data and components (load before scripts)-->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script src="js/form-validation.js"></script>
  </head>

  <body class="d-flex flex-column h-100">
    <div
      id="loadOverlay"
      style="
        background-color: #090A0F;
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        z-index: 2000;
      "
    >
      <div
        style="
          display: flex;
          width: 100%;
          height: 100%;
          margin: auto;
          align-items: center;
          color: white;
          justify-content: center;
          font-size: 24px;
          font-weight: bold;
          animation: pulse 1s infinite alternate;
        "
      >
        <div class="loading-spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <main class="flex-shrink-0">
      <!-- Global Ambient Background -->
      <div class="position-fixed top-0 start-0 w-100 h-100" style="z-index: -1; pointer-events: none; overflow: hidden;">
        <div class="ambient-blob blob-primary" style="width: 600px; height: 600px; top: -10%; left: -10%; animation-delay: 0s;"></div>
        <div class="ambient-blob blob-info" style="width: 500px; height: 500px; top: 40%; right: -10%; animation-delay: -5s;"></div>
        <div class="ambient-blob blob-secondary" style="width: 700px; height: 700px; bottom: -20%; left: 20%; animation-delay: -10s;"></div>
      </div>
      <!-- Navigation (injected from js/data.js + components.js)-->
      <div id="nav-placeholder"></div>

      <!-- Page content-->
      <section class="py-5 mt-5">
        <div class="container px-5">
          <!-- Contact form-->
          <div class="card experience-card-forge">
            <div class="text-center mb-5">
              <div class="d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-4" style="width: 4.5rem; height: 4.5rem; background: linear-gradient(135deg, rgba(30,48,243,0.15), rgba(30,48,243,0.05)); color: var(--bs-primary); border: 1px solid rgba(30,48,243,0.2);">
                <i class="bi bi-envelope fs-1"></i>
              </div>
              <h1 class="fw-bolder app-text-primary display-5">Get in touch</h1>
              <p class="lead fw-normal app-text-secondary mb-0">Open to discussing scalable systems and architecture.</p>
            </div>

            <div class="card experience-card-forge mb-5">
              <div class="text-center">
                <a href="mailto:pushanalagiya@gmail.com" class="h4 text-primary text-decoration-none fw-bold mb-4 d-block email-in-contact">
                  pushanalagiya@gmail.com
                </a>
                <div class="p-4 mx-auto" style="max-width: 400px;">
                  <div id="socialLinksContainer" class="d-flex justify-content-center gap-4 contact-items fs-3">
                    <!-- Social links injected from js/data.js -->
                  </div>
                </div>
              </div>
            </div>

            <!-- All inputs -->
            <div class="card experience-card-forge mb-5 contact-inputs">
              <div>
                <div class="row gx-5 justify-content-center">
                  <div class="col-lg-8 col-xl-6">
                    <div class="app-text-primary fw-bolder mb-4 text-center fs-5">
                      Send a Message
                    </div>
                    <form id="contactForm">
                      <div class="form-floating mb-3">
                        <input
                          class="form-control app-bg app-border app-text-primary"
                          id="name"
                          type="text"
                          placeholder="Enter your name..."
                          data-sb-validations="required"
                        />
                        <label for="name" class="app-text-secondary">Full name</label>
                        <div
                          class="invalid-feedback"
                          data-sb-feedback="name:required"
                        >
                          A name is required.
                        </div>
                      </div>
                      <!-- Email input-->
                      <div class="form-floating mb-3">
                        <input
                          class="form-control app-bg app-border app-text-primary"
                          id="email"
                          type="email"
                          placeholder="name@example.com"
                          data-sb-validations="required,email"
                        />
                        <label for="email" class="app-text-secondary">Email address</label>
                        <div
                          class="invalid-feedback"
                          data-sb-feedback="email:required"
                        >
                          An email is required.
                        </div>
                        <div
                          class="invalid-feedback"
                          data-sb-feedback="email:email"
                        >
                          Email is not valid.
                        </div>
                      </div>
                      <!-- Phone number input-->
                      <div class="form-floating mb-3">
                        <input
                          class="form-control app-bg app-border app-text-primary"
                          id="phone"
                          type="tel"
                          placeholder="(123) 456-7890"
                          data-sb-validations="required"
                        />
                        <label for="phone" class="app-text-secondary">Phone number</label>
                        <div
                          class="invalid-feedback"
                          data-sb-feedback="phone:required"
                        >
                          A phone number is required.
                        </div>
                      </div>
                      <!-- Message input-->
                      <div class="form-floating mb-3">
                        <textarea
                          class="form-control app-bg app-border app-text-primary"
                          id="message"
                          type="text"
                          placeholder="Enter your message here..."
                          style="height: 10rem"
                          data-sb-validations="required"
                        ></textarea>
                        <label for="message" class="app-text-secondary">Message</label>
                        <div
                          class="invalid-feedback"
                          data-sb-feedback="message:required"
                        >
                          A message is required.
                        </div>
                      </div>
                      <div class="d-none" id="submitSuccessMessage">
                        <div class="text-center mb-3 text-success">
                          <div class="fw-bolder">Form submission successful!</div>
                        </div>
                      </div>
                      <div class="d-none" id="submitErrorMessage">
                        <div class="text-center text-danger mb-3">Error sending message!</div>
                      </div>

                      <div class="d-grid">
                        <button
                          class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm"
                          id="submitButton"
                          type="submit"
                          onclick="submitForm()"
                        >
                          Submit
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer (injected from js/components.js)-->
    <div id="footer-placeholder"></div>
  </body>
</html>
