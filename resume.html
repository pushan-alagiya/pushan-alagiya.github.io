<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="google-site-verification" content="fssZF9jqXUfTCFFUgXvzD3GDM-6fsUcs8nzeJsVhnwI" />
  <meta name="keywords" content="Pushan, Alagiya, Portfoio, NodeJS Portfolio, NodeJS Developer, Blockchain " />
  <meta name="description" content="Pushan Alagiya Portfolio" />
  <meta property="og:title" content="Resume | Pushan Alagiya" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pushan-alagiya.github.io/resume" />
  <title>My Resume</title>

  <link rel="stylesheet" href="css/loader.css" />


  <!-- icon-->
  <link rel="icon" type="image/x-icon" href="assets/profile.png" />

  <!-- Custom Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />

  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Core theme CSS (includes Bootstrap)-->
  <link class="corecss" href="css/styles.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0/css/bootstrap.min.css">

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data and components (load before scripts)-->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <!-- Core theme JS-->
  <script src="js/scripts.js"></script>

  <!-- Professional Experience Cards & Modal Styles -->

</head>

<body class="d-flex flex-column h-100 bg-light">
  <main class="flex-shrink-0">
    <div id="loadOverlay" style="
        background-color: rgb(54, 54, 54);
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        z-index: 2000;
      ">
      <div style="
          display: flex;
          width: 100%;
          height: 100%;
          margin: auto;
          align-items: center;
          color: white;
          justify-content: center;
          font-size: 24px;
          font-weight: bold; /* Optionally make it bold */
          animation: pulse 1s infinite alternate; /* Add animation */
        ">
        <div class="loading-spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <!-- Navigation (injected from js/data.js + components.js)-->
    <div id="nav-placeholder"></div>

    <!-- Page Content-->
    <div class="container px-5 my-5">
      <div class="text-center mb-5">
        <h1 class="display-5 fw-bolder mb-0">
          <span class="text-gradient d-inline">Resume</span>
        </h1>
      </div>
      <div class="row gx-5 justify-content-center">
        <div class="col-lg-11 col-xl-9 col-xxl-8">
          <!-- Experience Section-->
          <section>
            <div class="d-flex align-items-center justify-content-between mb-4">
              <h2 class="text-primary fw-bolder mb-0">Experience</h2>
              <!-- Download resume button-->
              <a class="btn btn-primary px-4 py-3" href="assets/Resume.pdf">
                <div class="d-inline-block bi bi-download bi-align-center me-2">
                  <span class="d-none d-sm-inline">&nbsp; Download Resume</span>
                </div>
              </a>
            </div>

            <!-- Experience cards (injected from js/data.js)-->
            <div id="experienceContainer">
              <!-- Experience cards injected from js/data.js -->
            </div>

          </section>

          <!-- Divider-->
          <div class="pb-5"></div>
          <!-- Education Section (injected from js/data.js)-->
          <section>
            <h2 class="text-primary  fw-bolder mb-4">Education</h2>
            <div id="educationContainer">
              <!-- Education cards injected from js/data.js -->
            </div>
          </section>
          <!-- Divider-->
          <div class="pb-5"></div>
          <!-- Skills Section-->
          <section>
            <!-- Skillset Card-->
            <h2 class="text-primary  fw-bolder mb-4">Skills</h2>
            <div class="card shadow border-0 rounded-4 mb-5">
              <div class="card-body p-5">
                <!-- Professional skills list-->
                <div class="mb-5">
                  <div class="d-flex align-items-center mb-4">
                    <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3">
                      <i class="bi bi-tools"></i>
                    </div>
                    <h4 class="fw-bolder mb-0">
                      <span class="text-gradient d-inline">Professional Skills</span>
                    </h4>
                  </div>
                  <div id="skillsGrid" class="row row-cols-1 row-cols-md-3 g-4">
                    <!-- Professional skills injected from js/data.js -->
                  </div>
                  <div class="text-center mb-4 mt-4">
                    <button class="btn btn-outline-primary btn-sm" id="toggleSkills" onclick="toggleProfessionalSkills()">
                      <i class="bi bi-plus-circle me-1"></i>Show More Skills
                    </button>
                  </div>
                </div>
                <!-- Languages list-->
                <div class="mb-0">
                  <div class="d-flex align-items-center mb-4">
                    <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3">
                      <i class="bi bi-code-slash"></i>
                    </div>
                    <h3 class="fw-bolder mb-0">
                      <span class="text-gradient d-inline">Languages</span>
                    </h3>
                  </div>
                  <div id="languagesGrid" class="row row-cols-1 row-cols-md-3 g-4">
                    <!-- Languages/technologies injected from js/data.js -->
                  </div>
                  <div class="text-center mt-4">
                    <button class="btn btn-outline-primary btn-sm" id="toggleLanguages" onclick="toggleLanguages()">
                      <i class="bi bi-plus-circle me-1"></i>Show More Technologies
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>


          <div class="pb-5"></div>

          <!-- Awards Section-->
          <section>
            <a href="certificates.html">
              <h2 class="text-primary fw-bolder mb-4" style="display: inline-block;">Achievements</h2>
              <div class="feature link-icon bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3">
                <i class="bi bi-box-arrow-up-right"></i>
              </div>
            </a>
            <!-- Awards (injected from js/data.js)-->
            <div class="card shadow border-0 rounded-4 mb-5">
              <div class="card-body p-5">
                <div id="resumeAwardsContainer" class="row align-items-center gx-5">
                  <!-- Awards injected from js/data.js -->
                </div>
              </div>
            </div>
          </section>


          <!-- Divider-->
          <div class="pb-5"></div>
          <!-- Extra Curricular Section (injected from js/data.js)-->
          <section>
            <h2 class="text-primary fw-bolder mb-4">Extra Curriculars</h2>
            <div id="extracurricularContainer">
              <!-- Extracurricular cards injected from js/data.js -->
            </div>
          </section>




          <!-- Footer (injected from js/components.js)-->
          <div id="footer-placeholder"></div>

          <!-- Experience Modals (injected from js/data.js)-->
          <div id="experienceModalsContainer"></div>

</body>

</html>
